<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegenRadar Deutschland</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
}

#map {
    width: 100%;
    height: 100%;
    z-index: 1;
}

#time-display {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

#slider-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(20, 25, 35, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.3);
}

#slider-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

#slider-label-start,
#slider-label-end {
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    min-width: 36px;
}

#time-slider {
    flex: 1;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
}

#time-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #4da6ff;
    border: 3px solid #fff;
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    transition: transform 0.1s ease;
}

#time-slider::-webkit-slider-thumb:hover {
    transform: scale(1.15);
}

#time-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #4da6ff;
    border: 3px solid #fff;
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
}

#time-slider::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 3px;
}

#time-slider::-moz-range-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.15);
}

#slider-controls {
    display: flex;
    justify-content: center;
    gap: 8px;
}

#slider-controls button {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 6px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
    user-select: none;
}

#slider-controls button:hover {
    background: rgba(255, 255, 255, 0.22);
}

#slider-controls button:active {
    background: rgba(255, 255, 255, 0.3);
}

#btn-now {
    background: rgba(77, 166, 255, 0.3) !important;
    border-color: rgba(77, 166, 255, 0.5) !important;
    font-weight: 600;
}

#btn-now:hover {
    background: rgba(77, 166, 255, 0.45) !important;
}

#legend {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.legend-title {
    color: rgba(255, 255, 255, 0.7);
    font-size: 11px;
    text-align: center;
    margin-bottom: 6px;
}

.legend-items {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
}

.legend-color {
    width: 16px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
}

#no-data {
    position: absolute;
    top: 60px;
    left: 12px;
    z-index: 1000;
    background: rgba(180, 80, 0, 0.85);
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.3s ease;
}

#no-data.hidden {
    opacity: 0;
    pointer-events: none;
}

.leaflet-control-zoom {
    border: none !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
}

.leaflet-control-zoom a {
    background: rgba(0, 0, 0, 0.75) !important;
    color: #fff !important;
    border: none !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.leaflet-control-zoom a:hover {
    background: rgba(0, 0, 0, 0.9) !important;
}

.leaflet-control-attribution {
    background: rgba(0, 0, 0, 0.5) !important;
    color: rgba(255, 255, 255, 0.6) !important;
    font-size: 10px !important;
}

.leaflet-control-attribution a {
    color: rgba(255, 255, 255, 0.7) !important;
}

@media (max-width: 600px) {
    #time-display {
        font-size: 18px;
        padding: 6px 12px;
    }

    #slider-bar {
        padding: 10px 12px 14px;
    }

    #legend {
        padding: 8px 10px;
    }

    .legend-item {
        font-size: 10px;
    }
}
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="time-display">
        <span id="current-time">--:--</span>
    </div>

    <div id="slider-bar">
        <div id="slider-container">
            <span id="slider-label-start">00:00</span>
            <input type="range" id="time-slider" min="0" max="95" step="1" value="0" />
            <span id="slider-label-end">23:45</span>
        </div>
        <div id="slider-controls">
            <button id="btn-back" title="15 Min zurück">&#9664;</button>
            <button id="btn-now" title="Jetzt">Jetzt</button>
            <button id="btn-forward" title="15 Min vor">&#9654;</button>
        </div>
    </div>

    <div id="legend">
        <div class="legend-title">mm/h</div>
        <div class="legend-items">
            <div class="legend-item"><span class="legend-color" style="background: #c8e8ff;"></span>0.1</div>
            <div class="legend-item"><span class="legend-color" style="background: #a0d0ff;"></span>0.5</div>
            <div class="legend-item"><span class="legend-color" style="background: #64b4ff;"></span>1</div>
            <div class="legend-item"><span class="legend-color" style="background: #3296e6;"></span>2</div>
            <div class="legend-item"><span class="legend-color" style="background: #0a82c8;"></span>5</div>
            <div class="legend-item"><span class="legend-color" style="background: #0064a0;"></span>10</div>
            <div class="legend-item"><span class="legend-color" style="background: #004678;"></span>20</div>
            <div class="legend-item"><span class="legend-color" style="background: #6e28a0;"></span>50</div>
        </div>
    </div>

    <div id="no-data" class="hidden">Keine Radardaten für diesen Zeitpunkt verfügbar</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
(function () {
    'use strict';

    const GERMANY_CENTER = [51.2, 10.4];
    const DEFAULT_ZOOM = 7;
    const STEPS_PER_DAY = 96;
    const STEP_MINUTES = 15;
    const RAINVIEWER_API = 'https://api.rainviewer.com/public/weather-maps.json';

    let map;
    let radarLayer = null;
    let rainviewerData = null;
    let allFrames = [];

    const slider = document.getElementById('time-slider');
    const timeDisplay = document.getElementById('current-time');
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnNow = document.getElementById('btn-now');
    const noDataEl = document.getElementById('no-data');

    function init() {
        initMap();
        loadRainViewerData();
        initSlider();
        initControls();
        setInterval(loadRainViewerData, 5 * 60 * 1000);
    }

    function initMap() {
        map = L.map('map', {
            center: GERMANY_CENTER,
            zoom: DEFAULT_ZOOM,
            zoomControl: true,
            attributionControl: true,
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a> | Radar: <a href="https://www.rainviewer.com/">RainViewer</a>',
            subdomains: 'abcd',
            maxZoom: 18,
        }).addTo(map);
    }

    async function loadRainViewerData() {
        try {
            const response = await fetch(RAINVIEWER_API);
            const data = await response.json();
            rainviewerData = data;

            const past = data.radar?.past || [];
            const nowcast = data.radar?.nowcast || [];
            allFrames = [...past, ...nowcast].sort((a, b) => a.time - b.time);

            updateRadarForSlider();
        } catch (err) {
            console.error('Failed to load RainViewer data:', err);
        }
    }

    function findClosestFrame(targetUnix) {
        if (allFrames.length === 0) return null;

        let closest = allFrames[0];
        let minDiff = Math.abs(targetUnix - closest.time);

        for (const frame of allFrames) {
            const diff = Math.abs(targetUnix - frame.time);
            if (diff < minDiff) {
                minDiff = diff;
                closest = frame;
            }
        }

        if (minDiff > 15 * 60) return null;
        return closest;
    }

    function setRadarLayer(frame) {
        if (radarLayer) {
            map.removeLayer(radarLayer);
            radarLayer = null;
        }

        if (!frame || !rainviewerData) {
            noDataEl.classList.remove('hidden');
            return;
        }

        noDataEl.classList.add('hidden');

        var tileSize = window.devicePixelRatio >= 2 ? 512 : 256;

        radarLayer = L.tileLayer(
            rainviewerData.host + frame.path + '/' + tileSize + '/{z}/{x}/{y}/2/1_1.png',
            {
                tileSize: 256,
                opacity: 0.8,
                zIndex: 100,
                maxNativeZoom: 7,
                maxZoom: 18,
            }
        ).addTo(map);
    }

    function initSlider() {
        const nowStep = getCurrentTimeStep();
        slider.value = nowStep;
        updateTimeDisplay(nowStep);

        slider.addEventListener('input', function () {
            const step = parseInt(this.value, 10);
            updateTimeDisplay(step);
            updateRadarForSlider();
        });
    }

    function getCurrentTimeStep() {
        const now = new Date();
        const totalMinutes = now.getHours() * 60 + now.getMinutes();
        return Math.min(Math.round(totalMinutes / STEP_MINUTES), STEPS_PER_DAY - 1);
    }

    function stepToTime(step) {
        const totalMinutes = step * STEP_MINUTES;
        const hours = Math.floor(totalMinutes / 60) % 24;
        const minutes = totalMinutes % 60;
        return {
            hours,
            minutes,
            label: String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0'),
        };
    }

    function stepToUnixTimestamp(step) {
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const totalMinutes = step * STEP_MINUTES;
        return Math.floor(todayStart.getTime() / 1000) + totalMinutes * 60;
    }

    function updateTimeDisplay(step) {
        const time = stepToTime(step);
        timeDisplay.textContent = time.label;
    }

    function updateRadarForSlider() {
        const step = parseInt(slider.value, 10);
        const targetUnix = stepToUnixTimestamp(step);
        const closestFrame = findClosestFrame(targetUnix);
        setRadarLayer(closestFrame);
    }

    function initControls() {
        btnBack.addEventListener('click', function () {
            const current = parseInt(slider.value, 10);
            if (current > 0) {
                slider.value = current - 1;
                updateTimeDisplay(current - 1);
                updateRadarForSlider();
            }
        });

        btnForward.addEventListener('click', function () {
            const current = parseInt(slider.value, 10);
            if (current < STEPS_PER_DAY - 1) {
                slider.value = current + 1;
                updateTimeDisplay(current + 1);
                updateRadarForSlider();
            }
        });

        btnNow.addEventListener('click', function () {
            const nowStep = getCurrentTimeStep();
            slider.value = nowStep;
            updateTimeDisplay(nowStep);
            updateRadarForSlider();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') {
                btnBack.click();
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                btnForward.click();
                e.preventDefault();
            } else if (e.key === ' ' || e.key === 'Home') {
                btnNow.click();
                e.preventDefault();
            }
        });
    }

    document.addEventListener('DOMContentLoaded', init);
})();
    </script>
</body>
</html>
