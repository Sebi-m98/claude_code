<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing Changes Timeline</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script src="app.js"></script>
  <script>
    Promise.all([fetch('data.json').then(r => r.json()), fetch('asins.json').then(r => r.json())])
      .then(([data, asins]) => ListingChanges.init(document.getElementById('app'), data, asins))
      .catch(e => { document.getElementById('app').textContent = 'Daten konnten nicht geladen werden: ' + e.message; });
  </script>
</body>
</html>
