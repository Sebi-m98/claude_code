<title>Listing Changes Timeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f2f4f6; --surface:#ffffff; --surface-2:#e9ecef; --line:#d3d8de; --line-soft:#e6e9ed;
  --ink:#171a1f; --ink-2:#4b5563; --ink-3:#7b8592;
  --accent:#0f4c81;
  --c-price:#2a78d6; --c-image:#eb6834; --c-text:#1baf7a; --c-avail:#eda100; --c-other:#8a94a1;
  --good:#0ca30c; --critical:#d03b3b;
  --del-bg:rgba(208,59,59,.18); --ins-bg:rgba(12,163,12,.2);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121417; --surface:#1b1e23; --surface-2:#23272d; --line:#353b44; --line-soft:#2a2f36;
    --ink:#f1f3f5; --ink-2:#c0c6cd; --ink-3:#8c95a0;
    --accent:#6aa9e9;
    --c-price:#3987e5; --c-image:#d95926; --c-text:#199e70; --c-avail:#c98500; --c-other:#8a94a1;
    --del-bg:rgba(230,103,103,.28); --ins-bg:rgba(12,163,12,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121417; --surface:#1b1e23; --surface-2:#23272d; --line:#353b44; --line-soft:#2a2f36;
  --ink:#f1f3f5; --ink-2:#c0c6cd; --ink-3:#8c95a0;
  --accent:#6aa9e9;
  --c-price:#3987e5; --c-image:#d95926; --c-text:#199e70; --c-avail:#c98500; --c-other:#8a94a1;
  --del-bg:rgba(230,103,103,.28); --ins-bg:rgba(12,163,12,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,.ev:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1400px;margin:0 auto;padding:16px 16px 40px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:12px}
.head h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.head .stand{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.head .stand b{color:var(--ink-2);font-weight:500}

.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px 8px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink-2);padding:4px 10px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--ground)}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface);cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;user-select:none}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}
.chip.off .sw{opacity:.35}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.sel{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);font-size:12.5px;max-width:260px}
.search{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);font-size:12.5px;width:180px}
.bar .grow{flex:1}
.bar .hint{font-size:12px;color:var(--ink-3)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline}

.body{display:grid;grid-template-columns:minmax(0,1fr) 360px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
@media (max-width:960px){.body{grid-template-columns:1fr}}
.lanes{overflow-x:auto;padding:4px 0 12px;user-select:none}
.lane-h{display:flex;align-items:baseline;gap:10px;padding:14px 16px 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.lane-h b{color:var(--ink);font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:14px;font-weight:600}
.lane-h .n{margin-left:auto;letter-spacing:0;text-transform:none}
svg{display:block}
svg text{font-family:var(--sans);fill:var(--ink-2)}
svg .lbl{font-size:12px}
svg .asin{font-family:var(--mono);font-size:11px;fill:var(--ink-3)}
svg .tick{font-size:11px;fill:var(--ink-3)}
svg .grid{stroke:var(--line-soft);stroke-width:1}
svg .row{stroke:var(--line-soft);stroke-width:1}
svg .today{stroke:var(--ink-3);stroke-dasharray:3 3}
svg .ev{cursor:pointer;stroke:var(--surface);stroke-width:2}
svg .ev.sel{stroke:var(--ink);stroke-width:2.5}
svg .ring{fill:none;stroke-width:2;pointer-events:none}
svg .cnt{font-family:var(--mono);font-size:9.5px;fill:#fff;pointer-events:none;font-weight:500}
svg .cnt.dark{fill:#171a1f}
svg .own-badge{fill:var(--ink)}
svg .own-badge-t{fill:var(--ground);font-size:9px;font-family:var(--mono);font-weight:500}
svg .comp-badge{fill:none;stroke:var(--ink-3)}
svg .comp-badge-t{fill:var(--ink-3);font-size:9px;font-family:var(--mono)}
svg .dim{opacity:.18}
svg .brush{fill:var(--accent);opacity:.12}
svg .empty{font-size:12px;fill:var(--ink-3)}
.lanes.brushing{cursor:col-resize}

.detail{border-left:1px solid var(--line-soft);padding:16px;font-size:13.5px;background:var(--surface);min-height:360px;max-height:80vh;overflow:auto}
@media (max-width:960px){.detail{border-left:0;border-top:1px solid var(--line-soft);max-height:none}}
.detail .empty{color:var(--ink-3)}
.detail h2{margin:0 0 2px;font-size:15px;font-weight:600;line-height:1.3}
.detail .sub{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 10px}
.detail .sub a{color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);font-family:var(--mono);margin:0 6px 4px 0}
.pill.own{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.evlist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ev-card{border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;background:var(--ground)}
.ev-card .fld{display:flex;align-items:center;gap:6px;font-size:12px;font-family:var(--mono);color:var(--ink-2);margin-bottom:6px}
.ba{display:grid;grid-template-columns:1fr 20px 1fr;gap:6px;align-items:center}
.ba .v{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:6px 8px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;min-height:32px;word-break:break-word}
.ba .v.big{font-size:16px;font-weight:500}
.ba .arr{text-align:center;color:var(--ink-3)}
.delta{font-family:var(--mono);font-size:12px;margin-top:6px}
.delta.up{color:var(--critical)}.delta.down{color:var(--good)}
.imgba{display:grid;grid-template-columns:1fr 20px 1fr;gap:6px;align-items:center}
.imgba a{display:block}
.imgba img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border:1px solid var(--line-soft);border-radius:4px}
.imgba .none{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:4px;color:var(--ink-3);font-size:12px;text-align:center;padding:6px}
.diff{font-size:12.5px;line-height:1.5;background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:6px 8px;white-space:pre-wrap;word-break:break-word}
.diff del{background:var(--del-bg);text-decoration:line-through;color:var(--ink-2)}
.diff ins{background:var(--ins-bg);text-decoration:none}
.diff.same{color:var(--ink-3)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:4px;border:1px solid var(--line);font-family:var(--mono)}
.badge.fba{border-color:var(--c-price);color:var(--c-price)}
.badge.fbm{border-color:var(--c-avail);color:var(--c-avail)}
.badge.none{border-color:var(--critical);color:var(--critical)}
.spark{margin-top:8px}
.spark text{font-size:10px;fill:var(--ink-3);font-family:var(--mono)}
.spark path{fill:none;stroke:var(--c-price);stroke-width:2}
.spark .g{stroke:var(--line-soft)}
.spark .pt{fill:var(--c-price);stroke:var(--surface);stroke-width:1.5}
.spark .pt.sel{fill:var(--ink)}
.caption{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.note{font-size:12px;color:var(--ink-3);margin:8px 0 0}

/* list view */
.table{overflow:auto;max-height:80vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{position:sticky;top:0;background:var(--surface);font-weight:600;color:var(--ink-2);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
td.mono{font-family:var(--mono);font-size:12px;white-space:nowrap}
td.val{max-width:320px;font-family:var(--mono);font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);padding:10px 16px 0}
@media (prefers-reduced-motion: no-preference){.ev{transition:r .12s}}

</style>
<div class="app" id="app"></div>
<script>
/* Listing Changes Timeline
 * Two swimlane timelines (own ASINs / competitor ASINs) over the "Changes" tab
 * of the ASIN tracker sheet, with a before/after detail panel.
 * No dependencies. Data arrives via ListingChanges.init(root, data, asins).
 */
const ListingChanges = (() => {
  const IMG = ["main_image", "image_1", "image_2", "image_3", "image_4", "image_5", "image_6"];
  const TXT = ["title", "bullet_1", "bullet_2", "bullet_3", "bullet_4", "bullet_5", "description"];
  const CATS = [
    ["price", "Preis"], ["image", "Bilder"], ["text", "Text"], ["avail", "Verfügbarkeit"], ["other", "Sonstiges"],
  ];
  const COL = { price: "var(--c-price)", image: "var(--c-image)", text: "var(--c-text)", avail: "var(--c-avail)", other: "var(--c-other)" };
  const CAT_LABEL = Object.fromEntries(CATS);
  const DAY = 864e5;

  const cat = f => f === "price" ? "price" : IMG.includes(f) ? "image" : TXT.includes(f) ? "text"
    : (f === "fulfillment" || f === "offer_count") ? "avail" : "other";
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pd = s => new Date(s + "T00:00:00");
  const fmtD = d => d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
  const fmtDs = d => d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  const fmtEur = v => (v === "" || v == null || isNaN(+v)) ? "—" : (Math.round(+v * 100) / 100).toFixed(2).replace(".", ",") + " €";

  let root, DATA, LANES_OWN, LANES_COMP, NAME, TITLE, COMPOF, TODAY, MIN, MARKETS;
  const state = { days: 0, range: null, cats: new Set(CATS.map(c => c[0])), asin: "", mp: "", q: "", view: "timeline", sel: null };

  // ---------- data prep ----------
  function prepare(data, asins) {
    const rows = data.changes.map(r => ({ ...r, c: cat(r.field), t: pd(r.date) }));
    NAME = {}; TITLE = {}; COMPOF = {};
    const own = [], comp = [];
    (asins.own || []).forEach(o => { own.push(o.asin); NAME[o.asin] = o.label || short(o.title); TITLE[o.asin] = o.title || ""; });
    (asins.competitors || []).forEach(c => { comp.push(c.asin); COMPOF[c.asin] = c.compOf; NAME[c.asin] = c.label || short(c.title); TITLE[c.asin] = c.title || ""; });
    rows.forEach(r => {
      if (r.compOf) {
        if (!COMPOF[r.asin]) { COMPOF[r.asin] = r.compOf; comp.push(r.asin); }
        if (!NAME[r.compOf]) { NAME[r.compOf] = short(r.compOfProduct); TITLE[r.compOf] = r.compOfProduct; own.push(r.compOf); }
      } else if (!own.includes(r.asin)) { own.push(r.asin); }
      if (!NAME[r.asin]) { NAME[r.asin] = short(r.product); TITLE[r.asin] = r.product; }
      if (!TITLE[r.asin]) TITLE[r.asin] = r.product;
    });
    LANES_OWN = own.map(a => ({ a, own: true }));
    LANES_COMP = comp.slice().sort((x, y) => own.indexOf(COMPOF[x]) - own.indexOf(COMPOF[y]))
      .map(a => ({ a, own: false }));
    let k = {}; LANES_COMP.forEach(l => { const p = COMPOF[l.a]; k[p] = (k[p] || 0) + 1; l.k = k[p]; });
    const dates = rows.map(r => r.t.getTime());
    MIN = new Date(Math.min(...dates) - 3 * DAY);
    const exp = data.exportedAt ? pd(data.exportedAt) : new Date(Math.max(...dates));
    TODAY = exp;
    MARKETS = [...new Set(rows.map(r => r.marketplace).filter(Boolean))];
    DATA = rows;
  }
  const short = t => (t || "").replace(/\s+[–|-].*$/, "").slice(0, 32);

  // ---------- filtering ----------
  function domain() {
    if (state.range) return [state.range[0], state.range[1]];
    const s = state.days ? new Date(TODAY.getTime() - state.days * DAY) : MIN;
    return [s, new Date(TODAY.getTime() + 2 * DAY)];
  }
  function laneMatches(a) {
    if (state.mp && !DATA.some(r => r.asin === a && (r.marketplace || "") === state.mp)) return false;
    if (state.q) {
      const q = state.q.toLowerCase();
      return a.toLowerCase().includes(q) || (NAME[a] || "").toLowerCase().includes(q) || (TITLE[a] || "").toLowerCase().includes(q);
    }
    return true;
  }
  function inFocus(a) {
    if (!state.asin) return true;
    return a === state.asin || COMPOF[a] === state.asin;
  }
  function visibleRows() {
    const [d0, d1] = domain();
    return DATA.filter(r => r.t >= d0 && r.t <= d1 && state.cats.has(r.c)
      && (!state.mp || (r.marketplace || "") === state.mp) && laneMatches(r.asin) && inFocus(r.asin));
  }
  function groups(rows) {
    const m = new Map();
    rows.forEach(r => { const k = r.asin + "|" + r.date; if (!m.has(k)) m.set(k, { a: r.asin, d: r.date, t: r.t, evs: [] }); m.get(k).evs.push(r); });
    return [...m.values()];
  }

  // ---------- shell ----------
  function shell() {
    root.innerHTML = `
      <div class="head">
        <h1>Listing Changes</h1>
        <span class="stand">Stand <b id="stand"></b> · <b id="total"></b> Änderungen · Quelle: ASIN-Tracker › Changes</span>
      </div>
      <div class="bar">
        <span class="seg" id="range">
          <button data-d="30">30 Tage</button><button data-d="90">90 Tage</button><button data-d="0" class="on">Alles</button>
        </span>
        <span id="zoom" class="hint" hidden></span>
        <span id="cats"></span>
        <select id="asinsel" class="sel"><option value="">Alle eigenen ASINs</option></select>
        <select id="mpsel" class="sel" hidden><option value="">Alle Märkte</option></select>
        <input id="q" class="search" type="search" placeholder="ASIN oder Produkt suchen">
        <span class="grow"></span>
        <span class="seg" id="view"><button data-v="timeline" class="on">Zeitleiste</button><button data-v="list">Liste</button></span>
      </div>
      <div class="body">
        <div id="left"></div>
        <div class="detail" id="detail"></div>
      </div>
      <div class="legend" id="legend"></div>`;
    root.querySelector("#stand").textContent = fmtD(TODAY);
    root.querySelector("#total").textContent = DATA.length;
    const catsEl = root.querySelector("#cats");
    CATS.forEach(([k, l]) => {
      const b = document.createElement("button"); b.className = "chip on"; b.type = "button";
      b.innerHTML = `<span class="sw" style="background:${COL[k]}"></span>${l}`;
      b.onclick = () => { state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k); b.classList.toggle("on"); b.classList.toggle("off"); render(); };
      catsEl.appendChild(b);
    });
    root.querySelectorAll("#range button").forEach(b => b.onclick = () => {
      root.querySelectorAll("#range button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      state.days = +b.dataset.d; state.range = null; render();
    });
    root.querySelectorAll("#view button").forEach(b => b.onclick = () => {
      root.querySelectorAll("#view button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      state.view = b.dataset.v; render();
    });
    const sel = root.querySelector("#asinsel");
    LANES_OWN.forEach(l => { const o = document.createElement("option"); o.value = l.a; o.textContent = `${NAME[l.a]} · ${l.a}`; sel.appendChild(o); });
    sel.onchange = () => { state.asin = sel.value; render(); };
    const mp = root.querySelector("#mpsel");
    if (MARKETS.length > 1) { mp.hidden = false; MARKETS.forEach(m => { const o = document.createElement("option"); o.value = m; o.textContent = m; mp.appendChild(o); }); mp.onchange = () => { state.mp = mp.value; render(); }; }
    const q = root.querySelector("#q"); q.oninput = () => { state.q = q.value.trim(); render(); };
    root.querySelector("#legend").innerHTML = `<span>Punkt = Tag mit Änderungen, Zahl = Anzahl. Ring = zweite Kategorie am selben Tag.</span><span>Ziehen auf der Zeitleiste zoomt.</span><span>Gestrichelt = Datenstand.</span>`;
  }

  // ---------- timeline ----------
  function drawLane(svg, lanes, rows, label) {
    const W = Math.max(svg.parentElement.clientWidth || 800, 640), LEFT = 176, RIGHT = 56, RH = 30, TOP = 24;
    const H = TOP + Math.max(lanes.length, 1) * RH + 8;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H); svg.setAttribute("width", "100%");
    const [d0, d1] = domain();
    const x = d => LEFT + (d - d0) / (d1 - d0) * (W - LEFT - RIGHT);
    const xInv = px => new Date(d0.getTime() + (px - LEFT) / (W - LEFT - RIGHT) * (d1 - d0));
    let s = "";
    const span = (d1 - d0) / DAY;
    const t = new Date(d0.getFullYear(), d0.getMonth(), 1);
    if (span > 45) {
      while (t < d1) {
        if (t >= d0) { const xx = x(t); s += `<line class="grid" x1="${xx}" y1="${TOP - 4}" x2="${xx}" y2="${H - 6}"/><text class="tick" x="${xx + 4}" y="${TOP - 9}">${t.toLocaleDateString("de-DE", { month: "short", year: "2-digit" })}</text>`; }
        t.setMonth(t.getMonth() + 1);
      }
    } else {
      const step = span > 14 ? 7 : span > 5 ? 2 : 1;
      const start = new Date(Math.ceil(d0.getTime() / DAY) * DAY);
      for (let d = start; d < d1; d = new Date(d.getTime() + step * DAY)) {
        const xx = x(d); s += `<line class="grid" x1="${xx}" y1="${TOP - 4}" x2="${xx}" y2="${H - 6}"/><text class="tick" x="${xx + 3}" y="${TOP - 9}">${fmtDs(d)}</text>`;
      }
    }
    if (TODAY >= d0 && TODAY <= d1) { const xt = x(TODAY); s += `<line class="today" x1="${xt}" y1="${TOP - 4}" x2="${xt}" y2="${H - 6}"/>`; }
    if (!lanes.length) s += `<text class="empty" x="${LEFT}" y="${TOP + 18}">Keine ${label} im Filter.</text>`;
    const gs = groups(rows);
    lanes.forEach((ln, i) => {
      const y = TOP + i * RH + RH / 2;
      const dim = !inFocus(ln.a) || !laneMatches(ln.a);
      s += `<g class="${dim ? "dim" : ""}"><line class="row" x1="${LEFT}" y1="${y}" x2="${W - RIGHT}" y2="${y}"/>`;
      s += ln.own
        ? `<rect class="own-badge" x="10" y="${y - 7}" width="18" height="14" rx="3"/><text class="own-badge-t" x="13" y="${y + 3.5}">ME</text>`
        : `<rect class="comp-badge" x="10" y="${y - 7}" width="18" height="14" rx="3"/><text class="comp-badge-t" x="13.5" y="${y + 3.5}">K${ln.k}</text>`;
      const nm = NAME[ln.a] || ln.a;
      const sub = ln.own ? ln.a : `${ln.a} · zu ${NAME[COMPOF[ln.a]] || COMPOF[ln.a]}`;
      s += `<text class="lbl" x="34" y="${y - 2}"><title>${esc(TITLE[ln.a])}</title>${esc(nm.length > 24 ? nm.slice(0, 23) + "…" : nm)}</text><text class="asin" x="34" y="${y + 10}">${esc(sub.length > 30 ? sub.slice(0, 29) + "…" : sub)}</text>`;
      if (dim) { s += "</g>"; return; }
      gs.filter(g => g.a === ln.a).forEach(g => {
        const evs = g.evs; const n = evs.length; const r = n > 1 ? 8 : 5.5;
        const counts = {}; evs.forEach(e => counts[e.c] = (counts[e.c] || 0) + 1);
        const order = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
        const isSel = state.sel && state.sel.a === g.a && state.sel.d === g.d;
